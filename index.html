<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Snippet Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <header>
            <div class="header-content">
                <h1>Audio Snippets</h1>
                <p>The best place to get any audio snippet you need, generated on demand. Leave a comment to request new sounds.</p>
            </div>
            <button id="request-audio-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Request Audio</span>
            </button>
        </header>

        <main>
            <div class="controls">
                <div class="search-wrapper">
                    <input type="search" id="search-input" placeholder="Search for sounds (e.g., 'laser', 'ui')">
                </div>
                <div id="tag-filters" class="tag-filters">
                    <!-- Tag buttons will be dynamically generated by JS -->
                </div>
            </div>
            <div id="gallery" class="gallery">
                <!-- Audio cards will be dynamically generated by JS -->
            </div>
             <p id="no-results" class="hidden">No sounds found. Try a different search or filter.</p>
        </main>
    </div>

    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
