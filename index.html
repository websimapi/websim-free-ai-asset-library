<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Snippet Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <header>
            <div class="header-content">
                <h1>Free Audio Asset Library</h1>
            </div>
            <div class="header-actions">
                <button id="request-audio-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Request Audio</span>
                </button>
                <button id="generate-tts-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                    <span>Generate AI TTS</span>
                </button>
            </div>
        </header>
        <main>
            <div id="tts-generator" class="tts-generator hidden">
                <h2>Generate AI Text-to-Speech</h2>
                <div class="form-group">
                    <label for="tts-text">Text</label>
                    <textarea id="tts-text" rows="3" placeholder="Enter text to generate audio..." maxlength="200"></textarea>
                </div>
                <div class="form-group">
                    <label for="tts-voice">Voice</label>
                    <select id="tts-voice"></select>
                </div>
                <button id="generate-tts-submit" class="generate-button">
                    <span class="btn-text">Generate</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
            <div class="controls">
                <div class="search-wrapper">
                    <input type="search" id="search-input" placeholder="Search for sounds (e.g., 'laser', 'ui')">
                </div>
                <div class="tag-filters-wrapper">
                    <button id="scroll-left-btn" class="scroll-btn" aria-label="Scroll tags left">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <div id="tag-filters" class="tag-filters"></div>
                    <button id="scroll-right-btn" class="scroll-btn" aria-label="Scroll tags right">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
            <div id="gallery" class="gallery"></div>
            <p id="no-results" class="hidden">No sounds found. Try a different search or filter.</p>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>
    <script type="importmap">
    {
        "imports": {
            "websim": "/websim.js"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
